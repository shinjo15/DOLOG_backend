services:
  app:
    build:
      context: .
    ports:
      - "8001:8000"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - .:/var/www/html
    environment:
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_FROM_ADDRESS=no-reply@hibilio.local
      - MAIL_FROM_NAME=HIBILIO
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: php artisan serve --host=0.0.0.0 --port=8000
  mailpit:
    image: axllent/mailpit
    ports:
      - "8026:8025"
  redis:
    image: redis:7-alpine
